<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Control de SGs por Cancelar</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2f7;
      margin: 0;
      padding: 0;
    }
    .header {
      background: #0b5ed7;
      color: white;
      padding: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      margin: 0;
    }
    .header button {
      background: #ffc107;
      border: none;
      padding: 12px 18px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
    }
    .container {
      padding: 30px;
      max-width: 1200px;
      margin: auto;
    }
    .kpis {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }
    .kpi {
      background: white;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      font-size: 18px;
    }
    .kpi span {
      font-size: 32px;
      display: block;
      font-weight: bold;
    }
    .form, .table-box {
      background: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 25px;
    }
    input, select, button {
      padding: 10px;
      margin-top: 8px;
      width: 100%;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      font-size: 14px;
    }
    th {
      background: #f3f3f3;
    }
    .pendiente { color: orange; font-weight: bold; }
    .alerta { color: red; font-weight: bold; }
    .completado { color: green; font-weight: bold; }
