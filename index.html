<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Control de SGs por Cancelar</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            walmart: {
              blue: '#0053e2',
              spark: '#ffc220',
              light: '#f4f6f8'
            }
          }
        }
      }
    }
  </script>
</head>

<body class="bg-walmart-light font-sans text-gray-800">

<!-- HEADER -->
<header class="bg-walmart-blue text-white shadow">
  <div class="max-w-7xl mx-auto px-6 py-4 flex items-center gap-3">
    <i class="fas fa-ban text-walmart-spark text-xl"></i>
    <div>
      <h1 class="font-bold text-xl">Control de SGs por Cancelar</h1>
      <p class="text-sm opacity-90">Versión Autónoma y Analítica</p>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-6 py-8">

<!-- KPIs -->
<section class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
  <div class="bg-white rounded-lg shadow p-6 text-center">
    <p class="text-sm text-gray-500 font-semibold">Total Solicitudes</p>
    <p id="kpiTotal" class="text-4xl font-bold text-walmart-blue">0</p>
  </div>
  <div class="bg-yellow-50 rounded-lg shadow p-6 text-center">
    <p class="text-sm text-gray-500 font-semibold">Pendientes</p>
    <p id="kpiPendientes" class="text-4xl font-bold text-yellow-600">0</p>
  </div>
  <div class="bg-red-50 rounded-lg shadow p-6 text-center">
    <p class="text-sm text-gray-500 font-semibold">Alerta (+3 días)</p>
    <p id="kpiAlertas" class="text-4xl font-bold text-red-600">0</p>
  </div>
  <div class="bg-green-50 rounded-lg shadow p-6 text-center">
    <p class="text-sm text-gray-500 font-semibold">Completados</p>
    <p id="kpiCompletados" class="text-4xl font-bold text-green-600">0</p>
  </div>
</section>

<!-- FORMULARIO -->
<section class="bg-white rounded-lg shadow p-6 mb-8">
  <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
    <i class="fas fa-plus-circle text-walmart-blue"></i>
    Nueva Solicitud
  </h2>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <input id="inputSG"
           class="border rounded px-3 py-2 w-full"
           placeholder="Número SG (ej: 12345)"/>

    <input id="inputSolicitante"
           class="border rounded px-3 py-2 w-full"
           placeholder="Solicitado por"/>

    <!-- 🔑 type="button" ES CLAVE -->
    <button type="button"
            onclick="registrarSG()"
            class="bg-walmart-blue text-white font-bold rounded px-4 py-2 hover:bg-blue-700">
      Registrar SG
    </button>
  </div>
</section>

<!-- TABLA -->
<section class="bg-white rounded-lg shadow overflow-hidden">
  <table class="w-full">
    <thead class="bg-gray-100">
      <tr>
        <th class="px-4 py-3 text-left text-sm font-bold text-gray-600">Número SG</th>
        <th class="px-4 py-3 text-left text-sm font-bold text-gray-600">Solicitante</th>
        <th class="px-4 py-3 text-left text-sm font-bold text-gray-600">Fecha Ingreso</th>
        <th class="px-4 py-3 text-left text-sm font-bold text-gray-600">Estado</th>
        <th class="px-4 py-3 text-left text-sm font-bold text-gray-600">Gestión</th>
      </tr>
    </thead>
    <tbody id="tablaSG">
      <tr>
        <td colspan="5" class="px-4 py-6 text-center text-gray-500">
          No hay SGs registrados todavía ✅
        </td>
      </tr>
    </tbody>
  </table>
</section>

<footer class="mt-10 text-center text-sm text-gray-500">
  Control Operativo MFC · Walmart Chile
</footer>

</main>

<!-- ✅ LÓGICA -->
<script>
  let sgs = JSON.parse(localStorage.getItem("sgs_cancelados")) || [];

  function registrarSG() {
    const sg = inputSG.value.trim();
    const solicitante = inputSolicitante.value.trim();

    if (!sg || !solicitante) {
      alert("Debes ingresar el SG y el solicitante");
      return;
    }

    sgs.push({
      sg,
      solicitante,
      fecha: new Date().toISOString(),
      estado: "Pendiente"
    });

    localStorage.setItem("sgs_cancelados", JSON.stringify(sgs));

    inputSG.value = "";
    inputSolicitante.value = "";

    render();
  }

  function cerrarSG(index) {
    sgs[index].estado = "Completado";
    localStorage.setItem("sgs_cancelados", JSON.stringify(sgs));
    render();
  }

  function render() {
    const tbody = document.getElementById("tablaSG");
    tbody.innerHTML = "";

    let pendientes = 0;
    let alertas = 0;
    let completados = 0;

    sgs.forEach((item, index) => {
      const dias =
        (Date.now() - new Date(item.fecha)) / (1000 * 60 * 60 * 24);

      let estadoTexto = item.estado;
      let estadoClase = "text-yellow-600";

      if (item.estado === "Completado") {
        completados++;
        estadoClase = "text-green-600 font-bold";
      } else if (dias > 3) {
        estadoTexto = "Alerta";
        alertas++;
        pendientes++;
        estadoClase = "text-red-600 font-bold";
      } else {
        pendientes++;
      }

      tbody.innerHTML += `
        <tr class="border-t">
          <td class="px-4 py-2 font-mono">${item.sg}</td>
          <td class="px-4 py-2">${item.solicitante}</td>
          <td class="px-4 py-2">${new Date(item.fecha).toLocaleDateString()}</td>
          <td class="px-4 py-2 ${estadoClase}">${estadoTexto}</td>
          <td class="px-4 py-2">
            ${
              item.estado === "Pendiente"
                ? `<button class="text-blue-600 underline" onclick="cerrarSG(${index})">Cerrar</button>`
                : "—"
            }
          </td>
        </tr>
      `;
    });

    kpiTotal.textContent = sgs.length;
    kpiPendientes.textContent = pendientes;
    kpiAlertas.textContent = alertas;
    kpiCompletados.textContent = completados;
  }

  render();
</script>

</body>
</html>
``
