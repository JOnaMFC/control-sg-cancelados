<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Control SG Cancelados</title>

  <!-- Librería de gráficos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      padding: 30px;
    }
    h1 {
      color: #0071ce;
      margin-bottom: 10px;
    }
    .box {
      background: white;
      padding: 20px;
      border-radius: 8px;
      max-width: 1100px;
      margin-bottom: 30px;
    }
    input, select, textarea, button {
      width: 100%;
      margin-top: 8px;
      padding: 8px;
      font-size: 14px;
    }
    button {
      background-color: #ffc220;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
      font-size: 13px;
    }
    th {
      background-color: #eee;
    }
    .pendiente {
      color: #ff9800;
      font-weight: bold;
    }
    .gestionado {
      color: #2e7d32;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <!-- FORMULARIO -->
  <div class="box">
    <h1>Ingreso SG Cancelado</h1>

    <label>SG</label>
    <input id="sgInput" placeholder="SG123456">

    <label>Tipo de cancelación</label>
    <select id="tipoInput">
      <option value="Total">Total</option>
      <option value="Parcial">Parcial</option>
    </select>

    <label>Comentario operación</label>
    <textarea id="comentarioInput" placeholder="Motivo / contexto"></textarea>

    <button onclick="agregarSG()">Registrar SG</button>
  </div>

  <!-- TABLA -->
  <div class="box">
    <h1>Control Operativo</h1>

    <table>
      <thead>
        <tr>
          <th>Fecha</th>
          <th>SG</th>
