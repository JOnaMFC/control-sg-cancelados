<script>
let sgs = JSON.parse(localStorage.getItem("sgs_cancelados")) || [];

// REGISTRAR SG
function registrarSG() {
  const sg = inputSG.value.trim();
  const solicitante = inputSolicitante.value.trim();
  const responsable = inputResponsable.value.trim();

  if (!sg || !solicitante || !responsable) {
    alert("Completa todos los campos");
    return;
  }

  // 🚨 VALIDAR DUPLICADOS
  if (sgs.some(item => item.sg === sg)) {
    alert("Este SG ya está registrado");
    return;
  }

  sgs.push({
    sg,
    solicitante,
    registradoPor: responsable,
    fechaIngreso: new Date().toISOString(),
    fechaCierre: null,
    cerradoPor: null,
    estado: "Pendiente"
  });

  guardar();
  limpiarInputs();
  render();
}

// CERRAR SG
function cerrarSG(index) {
  const responsableCierre = prompt("¿Quién está cerrando este SG?");

  if (!responsableCierre) return;

  sgs[index].estado = "Completado";
  sgs[index].cerradoPor = responsableCierre;
  sgs[index].fechaCierre = new Date().toISOString();

  guardar();
  render();
}

// GUARDAR
function guardar() {
  localStorage.setItem("sgs_cancelados", JSON.stringify(sgs));
}

// LIMPIAR INPUTS
function limpiarInputs() {
  inputSG.value = "";
  inputSolicitante.value = "";
  inputResponsable.value = "";
}

// RENDER
function render() {
  const tbody = document.getElementById("tablaSG");
  tbody.innerHTML = "";

  let pendientes = 0;
  let alertas = 0;
  let completados = 0;

  sgs.forEach((item, index) => {
    const dias =
      (Date.now() - new Date(item.fechaIngreso)) / (1000 * 60 * 60 * 24);

    let estado = item.estado;
    let badge = "bg-yellow-100 text-yellow-700";

    if (item.estado === "Completado") {
      completados++;
      badge = "bg-green-100 text-green-700";
    } else if (dias > 3) {
      estado = "Alerta";
      alertas++;
      pendientes++;
      badge = "bg-red-100 text-red-700";
    } else {
      pendientes++;
    }

    tbody.innerHTML += `
      <tr class="border-t hover:bg-gray-50">
        <td class="px-4 py-2 font-mono">${item.sg}</td>
        <td class="px-4 py-2">${item.solicitante}</td>
        <td class="px-4 py-2">${item.registradoPor}</td>
        <td class="px-4 py-2">${new Date(item.fechaIngreso).toLocaleDateString()}</td>
        <td class="px-4 py-2">
          <span class="px-2 py-1 rounded text-xs font-bold ${badge}">
            ${estado}
          </span>
        </td>
        <td class="px-4 py-2 text-xs">
          ${
            item.estado === "Completado"
              ? `
                <div><b>Cerró:</b> ${item.cerradoPor}</div>
                <div><b>Fecha:</b> ${new Date(item.fechaCierre).toLocaleDateString()}</div>
              `
              : `
                <button class="text-blue-600 underline"
                        onclick="cerrarSG(${index})">
                  Cerrar
                </button>
              `
          }
        </td>
      </tr>
    `;
  });

  // KPIs
  kpiTotal.textContent = sgs.length;
  kpiPendientes.textContent = pendientes;
  kpiAlertas.textContent = alertas;
  kpiCompletados.textContent = completados;
}

render();
</script>
