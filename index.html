<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de SGs por Cancelar</title>

  <!-- ✅ TAILWIND CORRECTAMENTE CARGADO -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- ✅ FONT AWESOME -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            walmart: {
              blue: '#0053e2',
              spark: '#ffc220',
              light: '#f4f6f8'
            }
          }
        }
      }
    }
  </script>
</head>

<body class="bg-walmart-light font-sans text-gray-800">

<!-- HEADER -->
<nav class="bg-walmart-blue text-white shadow-md">
  <div class="max-w-7xl mx-auto px-6 py-4 flex items-center gap-3">
    <i class="fas fa-ban text-walmart-spark text-xl"></i>
    <div>
      <h1 class="font-bold text-xl">Control de SGs por Cancelar</h1>
      <p class="text-sm opacity-90">Versión Autónoma y Analítica</p>
    </div>
  </div>
</nav>

<main class="max-w-7xl mx-auto px-6 py-8">

<!-- KPIs -->
<section class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
  <div class="bg-white shadow rounded p-6 text-center">
    <p class="text-sm text-gray-500">Total Solicitudes</p>
    <p class="text-3xl font-bold text-walmart-blue" id="kpiTotal">0</p>
  </div>
  <div class="bg-yellow-50 shadow rounded p-6 text-center">
    <p class="text-sm text-gray-500">Pendientes</p>
    <p class="text-3xl font-bold text-yellow-600" id="kpiPendientes">0</p>
  </div>
  <div class="bg-red-50 shadow rounded p-6 text-center">
    <p class="text-sm text-gray-500">Alerta (+3 días)</p>
    <p class="text-3xl font-bold text-red-600" id="kpiAlertas">0</p>
  </div>
  <div class="bg-green-50 shadow rounded p-6 text-center">
    <p class="text-sm text-gray-500">Completados</p>
    <p class="text-3xl font-bold text-green-600" id="kpiCompletados">0</p>
  </div>
</section>

<!-- FORMULARIO -->
<section class="bg-white shadow rounded p-6 mb-8">
  <h2 class="font-bold mb-4 flex items-center gap-2">
    <i class="fas fa-plus-circle text-walmart-blue"></i>
    Nueva Solicitud
  </h2>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <input id="inputSG" class="border rounded px-3 py-2" placeholder="Número de SG">
    <input id="inputSolicitante" class="border rounded px-3 py-2" placeholder="Solicitado por">
    <button type="button" onclick="registrarSG()"
            class="bg-walmart-blue text-white font-bold rounded px-3 py-2 hover:bg-blue-700">
      Registrar SG
    </button>
  </div>
</section>

<!-- TABLA -->
<section class="bg-white shadow rounded overflow-hidden">
  <table class="w-full">
    <thead class="bg-gray-100">
      <tr>
        <th class="px-4 py-2 text-left">SG</th>
        <th class="px-4 py-2 text-left">Solicitante</th>
        <th class="px-4 py-2 text-left">Fecha</th>
        <th class="px-4 py-2 text-left">Estado</th>
        <th class="px-4 py-2 text-left">Gestión</th>
      </tr>
    </thead>
    <tbody id="tablaSG">
      <tr>
        <td colspan="5" class="text-center py-6 text-gray-500">
          No hay SGs registrados todavía ✅
        </td>
      </tr>
    </tbody>
  </table>
</section>

</main>

<!-- LÓGICA -->
<script>
  let sgs = JSON.parse(localStorage.getItem("sgs")) || [];

  function registrarSG() {
    const sg = inputSG.value.trim();
    const solicitante = inputSolicitante.value.trim();
    if (!sg || !solicitante) return alert("Completa los campos");

    sgs.push({ sg, solicitante, fecha: new Date(), estado: "Pendiente" });
    localStorage.setItem("sgs", JSON.stringify(sgs));
    inputSG.value = ""; inputSolicitante.value = "";
    render();
  }

  function cerrar(i) {
    sgs[i].estado = "Completado";
    localStorage.setItem("sgs", JSON.stringify(sgs));
    render();
  }

  function render() {
    tablaSG.innerHTML = "";
    let p=0,a=0,c=0;

    sgs.forEach((x,i)=>{
      const dias=(Date.now()-new Date(x.fecha))/(1000*60*60*24);
      let estado=x.estado, cls="text-yellow-600";
      if(estado==="Completado"){c++;cls="text-green-600 font-bold";}
      else if(dias>3){estado="Alerta";a++;p++;cls="text-red-600 font-bold";}
      else p++;

      tablaSG.innerHTML+=`
        <tr class="border-t">
          <td class="px-4 py-2 font-mono">${x.sg}</td>
          <td class="px-4 py-2">${x.solicitante}</td>
          <td class="px-4 py-2">${new Date(x.fecha).toLocaleDateString()}</td>
          <td class="px-4 py-2 ${cls}">${estado}</td>
          <td class="px-4 py-2">
            ${x.estado==="Pendiente"
              ? `<button class="text-blue-600 underline" onclick="cerrar(${i})">Cerrar</button>`
              : "—"}
          </td>
        </tr>`;
    });

    kpiTotal.textContent=sgs.length;
    kpiPendientes.textContent=p;
    kpiAlertas.textContent=a;
    kpiCompletados.textContent=c;
  }

  render();
</script>

</body>
</html>
