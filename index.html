<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Control de SGs por Cancelar</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Icons -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            walmart: {
              blue: '#0053e2',
              spark: '#ffc220',
              light: '#f4f6f8'
            }
          }
        }
      }
    }
  </script>
</head>

<body class="bg-walmart-light font-sans text-gray-800">

<!-- HEADER -->
<header class="bg-walmart-blue text-white shadow">
  <div class="max-w-7xl mx-auto px-6 py-4 flex items-center gap-3">
    <i class="fas fa-ban text-walmart-spark text-xl"></i>
    <div>
      <h1 class="font-bold text-xl">Control de SGs por Cancelar</h1>
      <p class="text-sm opacity-90">Versión Profesional</p>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-6 py-8">

<!-- KPIs -->
<section class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
  <div class="bg-white rounded-lg shadow p-6 text-center">
    <p class="text-sm text-gray-500 font-semibold">Total</p>
    <p id="kpiTotal" class="text-4xl font-bold text-walmart-blue">0</p>
  </div>
  <div class="bg-yellow-50 rounded-lg shadow p-6 text-center">
    <p class="text-sm text-gray-500 font-semibold">Pendientes</p>
    <p id="kpiPendientes" class="text-4xl font-bold text-yellow-600">0</p>
  </div>
  <div class="bg-red-50 rounded-lg shadow p-6 text-center">
    <p class="text-sm text-gray-500 font-semibold">Alertas</p>
    <p id="kpiAlertas" class="text-4xl font-bold text-red-600">0</p>
  </div>
  <div class="bg-green-50 rounded-lg shadow p-6 text-center">
    <p class="text-sm text-gray-500 font-semibold">Completados</p>
    <p id="kpiCompletados" class="text-4xl font-bold text-green-600">0</p>
  </div>
</section>

<!-- FORM -->
<section class="bg-white rounded-lg shadow p-6 mb-8">
  <h2 class="text-lg font-bold mb-4">
    Nueva Solicitud
  </h2>

  <div class="grid grid-cols-1 md:grid-cols-4 gap-4">

    <input id="inputSG"
           class="border rounded px-3 py-2"
           placeholder="Número SG"/>

    <input id="inputSolicitante"
           class="border rounded px-3 py-2"
           placeholder="Solicitado por"/>

    <input id="inputResponsable"
           class="border rounded px-3 py-2"
           placeholder="Registrado por"/>

    <button type="button"
            onclick="registrarSG()"
            class="bg-walmart-blue text-white font-bold rounded px-4 py-2 hover:bg-blue-700">
      Registrar
    </button>

  </div>
</section>

<!-- TABLE -->
<section class="bg-white rounded-lg shadow overflow-hidden">
  <table class="w-full text-sm">
    <thead class="bg-gray-100">
      <tr>
        <th class="px-4 py-3 text-left">SG</th>
        <th class="px-4 py-3 text-left">Solicitante</th>
        <th class="px-4 py-3 text-left">Registrado por</th>
        <th class="px-4 py-3 text-left">Ingreso</th>
        <th class="px-4 py-3 text-left">Estado</th>
        <th class="px-4 py-3 text-left">Gestión</th>
      </tr>
    </thead>
    <tbody id="tablaSG"></tbody>
  </table>
</section>

</main>

<!-- SCRIPT -->
<script>

const inputSG = document.getElementById("inputSG");
const inputSolicitante = document.getElementById("inputSolicitante");
const inputResponsable = document.getElementById("inputResponsable");

let sgs = JSON.parse(localStorage.getItem("sgs_cancelados")) || [];

// REGISTRAR
function registrarSG() {
  const sg = inputSG.value.trim();
  const solicitante = inputSolicitante.value.trim();
  const responsable = inputResponsable.value.trim();

  if (!sg || !solicitante || !responsable) {
    alert("Completa todos los campos");
    return;
  }

  if (sgs.some(item => item.sg === sg)) {
    alert("SG duplicado");
    return;
  }

  sgs.push({
    sg,
    solicitante,
    registradoPor: responsable,
    fechaIngreso: new Date().toISOString(),
    estado: "Pendiente",
    cerradoPor: null,
    fechaCierre: null
  });

  guardar();
  limpiar();
  render();
}

// CERRAR
function cerrarSG(index) {
  const quien = prompt("¿Quién cierra este SG?");
  if (!quien) return;

  sgs[index].estado = "Completado";
  sgs[index].cerradoPor = quien;
  sgs[index].fechaCierre = new Date().toISOString();

  guardar();
  render();
}

// GUARDAR
function guardar() {
  localStorage.setItem("sgs_cancelados", JSON.stringify(sgs));
}

// LIMPIAR
function limpiar() {
  inputSG.value = "";
  inputSolicitante.value = "";
  inputResponsable.value = "";
}

// RENDER
function render() {
  const tbody = document.getElementById("tablaSG");
  tbody.innerHTML = "";

  let pendientes = 0;
  let alertas = 0;
  let completados = 0;

  if (sgs.length === 0) {
    tbody.innerHTML = `
      <tr>
        <td colspan="6" class="text-center py-6 text-gray-500">
          Sin registros
        </td>
      </tr>`;
  }

  sgs.forEach((item, index) => {

    const dias = (Date.now() - new Date(item.fechaIngreso)) / 86400000;

    let estado = item.estado;
    let clase = "bg-yellow-100 text-yellow-700";

    if (item.estado === "Completado") {
      completados++;
      clase = "bg-green-100 text-green-700";
    } else if (dias > 3) {
      estado = "Alerta";
      alertas++;
      pendientes++;
      clase = "bg-red-100 text-red-700";
    } else {
      pendientes++;
    }

    tbody.innerHTML += `
      <tr class="border-t hover:bg-gray-50">
        <td class="px-4 py-2 font-mono">${item.sg}</td>
        <td class="px-4 py-2">${item.solicitante}</td>
        <td class="px-4 py-2">${item.registradoPor}</td>
        <td class="px-4 py-2">${new Date(item.fechaIngreso).toLocaleDateString()}</td>
        <td class="px-4 py-2">
          <span class="px-2 py-1 text-xs font-bold rounded ${clase}">
            ${estado}
          </span>
        </td>
        <td class="px-4 py-2 text-xs">
          ${
            item.estado === "Completado"
              ? `
                Cerró: ${item.cerradoPor}<br>
                ${new Date(item.fechaCierre).toLocaleDateString()}
              `
              : `
                <button class="text-blue-600 underline"
                        onclick="cerrarSG(${index})">
                  Cerrar
                </button>
              `
          }
        </td>
      </tr>
    `;
  });

  // KPIs
  document.getElementById("kpiTotal").textContent = sgs.length;
  document.getElementById("kpiPendientes").textContent = pendientes;
  document.getElementById("kpiAlertas").textContent = alertas;
  document.getElementById("kpiCompletados").textContent = completados;
}

render();

</script>

</body>
</html>
